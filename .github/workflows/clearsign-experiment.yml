name: Clear-sign experiment

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RATSPEAK_RSRETICULUM_REF: 3b3eb29c16c9dbc114c9b31d9f912a7b1a68652c
  RATSPEAK_RSLXMF_REF: 9e3f55cebd3f8b491aaab73b69d2a2afef17bad1
  RATSPEAK_RSLXST_REF: f228e2e1b1c026728c728549f70ce22633770009
  RATSPEAK_LRGP_REF: 88c8665e1e7e1ad710e53e8da6425f3dbe4f5856

jobs:
  clearsign:
    name: Clear-sign policy and wallet tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: Ratspeak
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsReticulum
          ref: ${{ env.RATSPEAK_RSRETICULUM_REF }}
          path: rsReticulum
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXMF
          ref: ${{ env.RATSPEAK_RSLXMF_REF }}
          path: rsLXMF
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/rsLXST
          ref: ${{ env.RATSPEAK_RSLXST_REF }}
          path: rsLXST
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository_owner }}/lrgp-rs
          ref: ${{ env.RATSPEAK_LRGP_REF }}
          path: lrgp-rs
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: Ratspeak
      - name: Test clear-sign decoder
        run: cargo test -p ratspeak-eth-clearsign --locked
        working-directory: Ratspeak
      - name: Test wallet clear-sign binding
        run: cargo test -p ratspeak-eth-wallet --locked
        working-directory: Ratspeak
      - name: Test Base Sepolia proof verifier
        run: cargo test -p ratspeak-eth-verifier --locked base_sepolia
        working-directory: Ratspeak
