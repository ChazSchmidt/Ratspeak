[package]
name = "ratspeak"
version = "1.0.31"
description = "Ratspeak: An all-in-one Reticulum & LXMF client in Rust."
authors = ["Ratspeak Contributors"]
license = "AGPL-3.0-or-later"
homepage = "https://github.com/ratspeak/Ratspeak"
repository = "https://github.com/ratspeak/Ratspeak"
edition = "2021"
rust-version = "1.87"
publish = false
resolver = "3"

[lib]
name = "ratspeak_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["lxst-voice"]
lxst-voice = ["ratspeak-tauri/lxst-voice"]
experimental-ethereum = ["dep:alloy-primitives", "dep:gtk", "dep:ratspeak-eth-node", "dep:ratspeak-eth-verifier", "dep:ratspeak-eth-wallet", "dep:ratspeak-eth-wallet-linux", "dep:reqwest", "dep:rns-identity", "dep:rustix", "dep:rustls"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-notification = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
alloy-primitives = { version = "=1.6.0", optional = true }
ratspeak-eth-node = { path = "../crates/ratspeak-eth-node", version = "=1.0.31", optional = true }
ratspeak-eth-verifier = { path = "../crates/ratspeak-eth-verifier", version = "=1.0.31", optional = true }
ratspeak-eth-wallet = { path = "../crates/ratspeak-eth-wallet", version = "=1.0.31", optional = true }
rns-identity = { path = "../../rsReticulum/crates/rns-identity", version = "1.2.0", optional = true }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"], optional = true }
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
ratspeak-tauri = { path = "../crates/ratspeak-tauri", version = "1.0.31", features = ["ble", "hardware"] }
rfd = "0.15"
dirs = "6"
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ratspeak-tauri = { path = "../crates/ratspeak-tauri", version = "1.0.31", default-features = false, features = ["ble", "rnode-tcp", "mobile-throttle", "seed"] }
tauri-plugin-haptics = "2"

[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.19"
btleplug = "0.11"
getrandom = "=0.3.4"
rns-interface = { path = "../../rsReticulum/crates/rns-interface", version = "1.2.0", features = ["ble", "mobile-throttle"] }
tracing-android = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", optional = true }
ratspeak-eth-wallet-linux = { path = "../crates/ratspeak-eth-wallet-linux", version = "=1.0.31", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", features = ["UIScrollView", "UIView", "UIResponder"] }
block2 = "0.6"
tracing-oslog = "0.3"

[profile.dev]
strip = "debuginfo"

[profile.release]
strip = true
lto = true
codegen-units = 1
# The Activity worker is an isolation boundary and deliberately recovers from
# an unwinding worker panic after purging its session. Abort mode would make
# that production recovery path unreachable.
panic = "unwind"
