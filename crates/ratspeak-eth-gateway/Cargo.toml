[package]
name = "ratspeak-eth-gateway"
description = "Validated Ethereum proof-bundle construction for Ratspeak gateways"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
alloy-consensus = { version = "=1.0.42", default-features = false, features = ["k256"] }
alloy-eips = { version = "=1.0.42", default-features = false }
alloy-primitives = "=1.6.0"
alloy-rlp = "=0.3.15"
alloy-rpc-types-eth = { version = "=1.0.42", default-features = false, features = ["serde", "std"] }
alloy-trie = { version = "=0.9.5", features = ["ethereum"] }
ratspeak-eth-verifier = { workspace = true }
lxmf-core = { workspace = true }
rmpv = { workspace = true }
rns-crypto = { workspace = true }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tracing = { workspace = true }
url = "2"

[dev-dependencies]
alloy-primitives = "=1.6.0"
alloy-rlp = "=0.3.15"
base64 = { workspace = true }
sha2 = "0.10"
tempfile = "3"
