[package]
name = "ratspeak-eth-gateway-daemon"
description = "Standalone native host for the experimental Ratspeak Ethereum gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
hex = { workspace = true }
libc = "0.2"
lxmf-core = { workspace = true }
ratspeak-eth-gateway = { workspace = true }
ratspeak-eth-verifier = { workspace = true }
rns-crypto = { workspace = true }
rns-identity = { workspace = true }
rns-link = { workspace = true }
rns-runtime = { workspace = true }
rns-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
alloy-primitives = "=1.6.0"
bytes = { workspace = true }
rmpv = { workspace = true }
ratspeak-eth-node = { workspace = true }
rns-wire = { workspace = true }
tempfile = "3"

[[bin]]
name = "ratspeak-eth-gatewayd"
path = "src/main.rs"

[[bin]]
name = "ratspeak-eth-checkpoint-card"
path = "src/bin/ratspeak-eth-checkpoint-card.rs"
